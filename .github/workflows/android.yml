name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  pull_request:
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write   # to attach the APK to a release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key, so each CI build installs over the last.
      # Without the secret the APK is signed with the runner's throwaway debug key.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/squareoff.apk

      - uses: actions/upload-artifact@v4
        with:
          name: squareoff-apk
          path: android/app/build/outputs/apk/release/squareoff.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/squareoff.apk
